server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bundle versionné par hash -> cache long.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : toute route inconnue (deep link, refresh sur /status/:id) -> index.html.
    location / {
        try_files $uri /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
