server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Site statique simple : pas de repli SPA (chaque URL est un fichier réel).
    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Doit rester frais : la page consomme /version.json du backend.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
